V.help=()=>`<div class="c"><h2>راهنمای اجرا</h2><div class="sm" style="line-height:2">
<b>فازها:</b> ۱) ۱۸ آبان تا آخر آبان: بازگشت به ۸ ساعت، سنجش سطح، شروع تست از هفتهٔ اول. ۲) آذر تا ۲۵ دی: دهم + نیم‌سال اول دوازدهم، یک آزمون مبحثی در هفته. ۳) بعد از ۲۵ دی: تکمیل یازدهم/دوازدهم، تثبیت دهم. ۴) تسلط: تست زمان‌دار و جامع. ۵) جمع‌بندی: دفتر اشتباهات و آزمون‌های شبیه‌ساز.<br>
<b>افزایش ساعت:</b> فقط وقتی دو هفته پشت‌سرهم ≥۸۵٪ برنامه را اجرا کردی و خوابت منظم بود، ۱ ساعت اضافه کن (۸←۹←۱۰…). ۱۴ ساعت الزام نیست.<br>
<b>زیست:</b> درسنامه IQ ← مقایسه با کتاب ← بازیابی بدون نگاه ← تست آموزشی ← تحلیل ← مرور. وقتی روی تست آموزشی یک مبحث ≥۷۰٪ بودی، به تست زمان‌دار برو.<br>
<b>ژنتیک:</b> هر مرحله (پیش‌نیاز ← نمادگذاری ← ساده ← چندمرحله‌ای ← ترکیبی) فقط وقتی ۵ مسئلهٔ پشت‌سرهم را بدون نگاه به حل درست کردی. ۶ تست روزانه، تحلیل تک‌تک غلط‌ها.<br>
<b>فیزیک:</b> مفهوم ← فرمول/کاربرد ← مثال ← تست تیپ‌بندی. نشر الگو فقط وقتی خیلی سبز را ≥۶۰٪ زدی (اختیاری).<br>
<b>ریاضی:</b> پیش‌نیازمحور؛ IQ فقط پس از ≥۶۰٪ در تست استاندارد. <b>شیمی:</b> محاسباتی/حفظی/واکنش‌ها جدا؛ ویدیو بیش از ۴۰٪ هر جلسه نباشد.<br>
<b>عمومی‌ها:</b> متن کتاب + نمونه‌سؤال تشریحی، ۳ بار مرور (۱، ۷، ۲۱ روز)، تست‌زنی کنکوری نه. ضرایب سوابق تحصیلی را از سایت سنجش تأیید کن؛ اینجا عددی حدس نزده‌ام.<br>
<b>اهداف دانشگاهی:</b> رتبهٔ پذیرش دندانپزشکی/فیزیوتراپی هر سال و سهمیه فرق می‌کند؛ عدد رسمی ندارم. هدف: بهترین نتیجهٔ ممکن، نه حداقل لازم؛ هیچ رتبه‌ای تضمین نیست.<br>
<b>مدیریت عقب‌افتادگی:</b> مرور و ضروری‌ها هرگز حذف نمی‌شوند؛ تست‌های جاافتاده انباشته نمی‌شوند؛ کم‌اهمیت‌ها به جمعه می‌روند.</div></div>`;
const jp=k=>{const o={};new Intl.DateTimeFormat('fa-IR-u-ca-persian-nu-latn',{year:'numeric',month:'numeric',day:'numeric'}).formatToParts(pd(k)).forEach(x=>o[x.type]=+x.value);return o};
function mStart(off){let k=today();while(jp(k).day>1)k=addD(k,-1);for(let i=0;i<Math.abs(off);i++){const s=off>0?1:-1;let n=addD(k,s);while(jp(n).day>1)n=addD(n,s);k=n}return k}
V.cal=()=>{S.cm=S.cm||0;const T=today(),ms=mStart(S.cm);let me=addD(ms,1);while(jp(me).day>1)me=addD(me,1);const n=df(ms,me),lead=(pd(ms).getDay()+1)%7;let a=0,b=0,cells='';for(let i=0;i<n;i++){const k=addD(ms,i),dn=jd(k,{day:'numeric'}),mk=(EX.includes(k)?'🧪':'')+(k==S.set.maz?'⭐':'')+(k==S.set.exam?'🎯':'');if(k<S.start||k>S.set.exam){cells+=`<div class="cd" style="opacity:.35" onclick="S.view='${k}';render()">${dn}</div>`;continue}let info='·';if(k<=addD(T,14)){upTo(k);const L=S.days[k].filter(x=>!x.gone),d=L.filter(x=>x.d).length;a+=d;b+=L.length;info=fa(d)+'/'+fa(L.length)}cells+=`<div class="cd ${k<T&&info!='·'?(info.split('/')[0]==info.split('/')[1]?'p':'m'):''} ${k==T?'n':''}" onclick="S.view='${k}';save();render()">${dn}${mk}<div class="sm">${info}</div></div>`}return`<div class="c"><div class="r" style="justify-content:space-between"><button class="b s" onclick="S.cm--;render()">ماه قبل ▶</button><h2>${jd(ms,{year:'numeric',month:'long'})}</h2><button class="b s" onclick="S.cm++;render()">◀ ماه بعد</button></div><div class="cal">${['ش','ی','د','س','چ','پ','ج'].map(x=>`<div class="sm" style="text-align:center">${x}</div>`).join('')}${'<div></div>'.repeat(lead)}${cells}</div><div class="r"><button class="b s" onclick="S.cm=0;S.view=today();render()">امروز</button></div><div class="sm">سبز: کامل · قرمز: ناقص · قاب بنفش: امروز · 🧪 آزمون ماز · ⭐ آزمون ۲۵ دی · 🎯 کنکور. روزهای دور با «·» نشان داده می‌شوند و با کلیک برنامه‌اشان ساخته می‌شود.</div></div>`+dayView(S.view)};
